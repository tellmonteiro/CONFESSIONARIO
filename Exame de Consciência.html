<style>
  /* Layout concept: phone-first single page app — a sticky tab bar switches between
     an intro, four numbered examination sections (each with subsections of checkbox
     items) and a live "Minha Lista" summary built from whatever is checked. */
  :root{
    --bg:#F7F1EA;
    --surface:#FFFFFF;
    --surface-2:#EFE4D6;
    --fg:#2A2130;
    --muted:#746A80;
    --accent:#9A1B2E;
    --accent-ink:#FFFFFF;
    --border:#E4D7C6;
    --checked:#F8E6E4;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15111C;
      --surface:#1E1826;
      --surface-2:#271F31;
      --fg:#EFE7F5;
      --muted:#AC9FBE;
      --accent:#E35367;
      --accent-ink:#2B0610;
      --border:#3A2B2E;
      --checked:#341C21;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15111C;
    --surface:#1E1826;
    --surface-2:#271F31;
    --fg:#EFE7F5;
    --muted:#AC9FBE;
    --accent:#E35367;
    --accent-ink:#2B0610;
    --border:#3A2B2E;
    --checked:#341C21;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font-body);
    padding-inline:16px;
    padding-block:14px;
    display:flex;
    flex-direction:column;
    gap:14px;
    max-width:640px;
    margin-inline:auto;
  }
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
  p{margin:0; line-height:1.55;}

  header.top{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  }
  header.top h1{font-size:1.5rem; font-weight:600; letter-spacing:-0.01em;}
  header.top .eyebrow{
    font-family:var(--font-body); font-size:.68rem; letter-spacing:.09em;
    text-transform:uppercase; color:var(--muted); margin-bottom:2px; display:block;
  }

  nav.tabs{
    position:sticky; top:env(safe-area-inset-top,0px);
    z-index:5; background:var(--bg);
    display:flex; gap:6px; overflow-x:auto;
    padding-block:6px; margin-inline:-16px; padding-inline:16px;
    border-bottom:1px solid var(--border);
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    font-family:var(--font-body); font-weight:600; font-size:.82rem;
    color:var(--muted); background:transparent; border:1px solid transparent;
    border-radius:999px; padding:7px 13px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
    -webkit-tap-highlight-color:transparent;
  }
  nav.tabs button .badge{
    font-variant-numeric:tabular-nums; font-size:.68rem; font-weight:600;
    color:var(--muted); background:var(--surface-2); border-radius:999px;
    padding:1px 6px;
  }
  nav.tabs button[aria-selected="true"]{
    color:var(--accent-ink); background:var(--accent); border-color:var(--accent);
  }
  nav.tabs button[aria-selected="true"] .badge{color:var(--accent-ink); background:rgb(255 255 255 / .22);}
  nav.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  main{display:flex; flex-direction:column; gap:18px; padding-bottom:84px;}
  section.view{display:flex; flex-direction:column; gap:18px;}
  section.view[hidden]{display:none;}

  .intro-card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:16px 18px; display:flex; flex-direction:column; gap:10px;
  }
  .intro-card p{color:var(--fg);}
  .intro-card.muted-card{background:var(--surface-2);}

  ol.steps{margin:0; padding-left:1.15em; display:flex; flex-direction:column; gap:8px;}
  ol.steps li{padding-left:2px; line-height:1.5;}
  ol.steps li::marker{font-family:var(--font-display); color:var(--accent); font-weight:600;}

  blockquote.model{
    margin:0; font-style:italic; color:var(--fg); line-height:1.55;
    border-left:3px solid var(--accent); padding-left:12px;
  }

  .group-title{
    font-size:1.02rem; font-weight:600; font-family:var(--font-display);
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  }
  .group-title .count{
    font-family:var(--font-body); font-variant-numeric:tabular-nums;
    font-size:.72rem; font-weight:600; color:var(--muted);
  }
  .group{display:flex; flex-direction:column; gap:10px;}
  .section-intro{color:var(--muted); font-size:.88rem; line-height:1.5;}
  .verse{color:var(--fg); font-size:.89rem; line-height:1.55;}

  ul.items{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px;}
  ul.items li{margin:0;}
  label.item{
    display:flex; align-items:flex-start; gap:11px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:11px 13px; cursor:pointer; min-height:44px;
    transition:background .12s ease, border-color .12s ease;
  }
  label.item:has(input:checked){
    background:var(--checked); border-color:var(--accent);
  }
  label.item input{
    appearance:none; -webkit-appearance:none;
    width:21px; height:21px; min-width:21px; margin-top:1px;
    border:1.6px solid var(--muted); border-radius:6px; background:var(--surface);
    position:relative; cursor:pointer;
  }
  label.item input:checked{background:var(--accent); border-color:var(--accent);}
  label.item input:checked::after{
    content:""; position:absolute; left:6px; top:2px; width:5px; height:10px;
    border:solid var(--accent-ink); border-width:0 2px 2px 0; transform:rotate(40deg);
  }
  label.item input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  label.item span{line-height:1.42; font-size:.92rem; padding-top:1px;}

  button.primary, button.secondary, button.ghost{
    font-family:var(--font-body); font-weight:600; font-size:.88rem;
    border-radius:11px; padding:11px 16px; cursor:pointer; border:1px solid transparent;
    -webkit-tap-highlight-color:transparent;
  }
  button.primary{background:var(--accent); color:var(--accent-ink);}
  button.secondary{background:var(--surface-2); color:var(--fg); border-color:var(--border);}
  button.ghost{background:transparent; color:var(--muted); border-color:var(--border);}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap;}

  .confirm-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:10px 12px;
  }
  .confirm-row span{font-size:.85rem; color:var(--muted);}

  .summary-group{display:flex; flex-direction:column; gap:8px;}
  .summary-group h3{font-size:.95rem; font-weight:600;}
  .summary-sub{font-size:.76rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600;}
  ol.summary-list{margin:0; padding-left:1.25em; display:flex; flex-direction:column; gap:6px;}
  ol.summary-list li{line-height:1.5; font-size:.94rem;}

  .empty-state{
    display:flex; flex-direction:column; align-items:flex-start; gap:10px;
    background:var(--surface); border:1px dashed var(--border); border-radius:14px;
    padding:20px 18px; color:var(--muted); font-size:.9rem; line-height:1.55;
  }

  .prayer-card{
    background:var(--surface-2); border:1px solid var(--border); border-radius:16px;
    padding:18px; display:flex; flex-direction:column; gap:12px;
  }
  .prayer-card p{font-family:var(--font-display); font-style:italic; font-size:1.04rem; line-height:1.6;}

  .source{
    font-size:.78rem; color:var(--muted); line-height:1.5; text-align:center;
    padding-top:4px; border-top:1px solid var(--border);
  }

  .dock{
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    display:flex; justify-content:center;
    padding-inline:16px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
    padding-top:10px;
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    pointer-events:none;
  }
  .dock-inner{
    pointer-events:auto;
    width:100%; max-width:608px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:0 8px 24px rgb(0 0 0 / .14);
    padding:10px 10px 10px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .dock-count{font-size:.84rem; color:var(--muted); font-variant-numeric:tabular-nums;}
  .dock-count strong{color:var(--fg); font-family:var(--font-display); font-size:1.1rem; font-weight:600;}
  .dock[hidden]{display:none;}

  .toast{
    position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%) translateY(8px); opacity:0;
    background:var(--fg); color:var(--bg); font-size:.82rem; font-weight:600;
    padding:9px 16px; border-radius:999px; z-index:9;
    transition:opacity .18s ease, transform .18s ease; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    label.item, .toast{transition:none;}
  }
</style>

    if (!state.checked) state.checked = {};
  } catch(e){ state = { checked:{} }; }

  function persist(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
  }

  function itemId(si, gi, ii){ return "s"+si+"-g"+gi+"-i"+ii; }

  function totalCount(){
    var t=0; DATA.forEach(function(s){ s.groups.forEach(function(g){ t+=g.items.length; }); });
    return t;
  }
  function checkedCount(sIdx){
    var c=0;
    DATA.forEach(function(s, si){
      if (sIdx!==undefined && si!==sIdx) return;
      s.groups.forEach(function(g, gi){
        g.items.forEach(function(it, ii){
          if (state.checked[itemId(si,gi,ii)]) c++;
        });
      });
    });
    return c;
  }

  var tabsEl = document.querySelector("nav.tabs");
  var views = {
    intro: document.getElementById("view-intro"),
    prep: document.getElementById("view-prep"),
    s0: document.getElementById("view-s0"),
    s1: document.getElementById("view-s1"),
    s2: document.getElementById("view-s2"),
    s3: document.getElementById("view-s3"),
    lista: document.getElementById("view-lista")
  };
  var TAB_ORDER = ["intro","prep","s0","s1","s2","s3","lista"];
  var current = "intro";

  function tabLabel(key){
    if (key==="intro") return "Início";
    if (key==="prep") return "Preparação";
    if (key==="lista") return "Lista";
    var idx = parseInt(key.replace("s",""),10);
    return DATA[idx].num;
  }

  function buildTabs(){
    tabsEl.innerHTML = "";
    TAB_ORDER.forEach(function(key){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("role","tab");
      btn.id = "tab-"+key;
      btn.dataset.key = key;
      var label = document.createElement("span");
      label.textContent = tabLabel(key);
      btn.appendChild(label);
      if (key.charAt(0)==="s"){
        var idx = parseInt(key.replace("s",""),10);
        var badge = document.createElement("span");
        badge.className = "badge";
        badge.id = "badge-"+key;
        var total = DATA[idx].groups.reduce(function(a,g){return a+g.items.length;},0);
        badge.textContent = checkedCount(idx) + "/" + total;
        btn.appendChild(badge);
      }
      btn.addEventListener("click", function(){ setTab(key); });
      tabsEl.appendChild(btn);
    });
  }

  function refreshBadges(){
    DATA.forEach(function(s, si){
      var badge = document.getElementById("badge-s"+si);
      if (!badge) return;
      var total = s.groups.reduce(function(a,g){return a+g.items.length;},0);
      badge.textContent = checkedCount(si) + "/" + total;
    });
    var dockCount = document.getElementById("dockCount");
    if (dockCount) dockCount.textContent = checkedCount();
  }

  function setTab(key){
    current = key;
    TAB_ORDER.forEach(function(k){
      views[k].hidden = (k!==key);
      var btn = document.getElementById("tab-"+k);
      if (btn) btn.setAttribute("aria-selected", k===key ? "true":"false");
    });
    document.getElementById("dock").hidden = (key==="lista");
    if (key==="lista") renderLista();
    window.scrollTo({top:0, behavior:"instant" in window ? "instant":"auto"});
  }

  function versesHTML(list){
    return list.map(function(v){ return "<p class=\"verse\">"+v+"</p>"; }).join("");
  }

  function renderPrep(){

  function buildClearRow(){
    var wrap = document.createElement("div");
    var row = document.createElement("div");
    row.className = "btn-row";
    var clearBtn = document.createElement("button");
    clearBtn.className = "ghost"; clearBtn.type = "button";
    clearBtn.textContent = "Limpar todas as marcações";
    row.appendChild(clearBtn);
    wrap.appendChild(row);

    var confirmRow = document.createElement("div");
    confirmRow.className = "confirm-row";
    confirmRow.hidden = true;
    confirmRow.innerHTML = "<span>Apagar todos os itens marcados?</span>";
    var yesBtn = document.createElement("button");
    yesBtn.className = "primary"; yesBtn.type="button"; yesBtn.textContent = "Sim, limpar";
    var noBtn = document.createElement("button");
    noBtn.className = "secondary"; noBtn.type="button"; noBtn.textContent = "Cancelar";
    confirmRow.appendChild(yesBtn);
    confirmRow.appendChild(noBtn);
    wrap.appendChild(confirmRow);

    clearBtn.addEventListener("click", function(){
      confirmRow.hidden = false; row.hidden = true;
    });
    noBtn.addEventListener("click", function(){
      confirmRow.hidden = true; row.hidden = false;
    });
    yesBtn.addEventListener("click", function(){
      state.checked = {}; persist();
      renderAllSections(); refreshBadges();
      confirmRow.hidden = true; row.hidden = false;
      showToast("Marcações apagadas.");
      if (current === "lista") renderLista();
    });
    return wrap;
  }

  function renderSection(si){
    var s = DATA[si];
    var el = views["s"+si];
    el.innerHTML = "";

    var head = document.createElement("div");
    head.innerHTML = "<span class=\"eyebrow\">Seção " + s.num + "</span><h2>" + s.title + "</h2><p class=\"section-intro\">Marque somente o que você cometeu.</p>";
    el.appendChild(head);

    s.groups.forEach(function(g, gi){
      var groupEl = document.createElement("div");
      groupEl.className = "group";
      var titleEl = document.createElement("div");
      titleEl.className = "group-title";
      titleEl.innerHTML = "<span>" + g.title + "</span><span class=\"count\" id=\"gcount-"+si+"-"+gi+"\"></span>";
      groupEl.appendChild(titleEl);

      var ul = document.createElement("ul");
      ul.className = "items";
      g.items.forEach(function(text, ii){
        var id = itemId(si,gi,ii);
        var li = document.createElement("li");
        var label = document.createElement("label");
        label.className = "item";
        var input = document.createElement("input");
        input.type = "checkbox";
        input.id = id;
        input.checked = !!state.checked[id];
        input.addEventListener("change", function(){
          if (input.checked) state.checked[id] = true;
          else delete state.checked[id];
          persist();
          updateGroupCount(si,gi);
          refreshBadges();
        });
        var span = document.createElement("span");
        span.textContent = text;
        label.appendChild(input);
        label.appendChild(span);
        li.appendChild(label);
        ul.appendChild(li);
      });
      groupEl.appendChild(ul);
      el.appendChild(groupEl);
      updateGroupCount(si,gi);
    });
  }

  function updateGroupCount(si,gi){
    var g = DATA[si].groups[gi];
    var c = 0;
    g.items.forEach(function(_, ii){ if (state.checked[itemId(si,gi,ii)]) c++; });
    var badge = document.getElementById("gcount-"+si+"-"+gi);
    if (badge) badge.textContent = c>0 ? (c+" marcado"+(c>1?"s":"")) : "";
  }

  function renderAllSections(){
    DATA.forEach(function(_, si){ renderSection(si); });
  }

  function renderLista(){
    var el = views.lista;
    el.innerHTML = "";

    var head = document.createElement("div");
    head.innerHTML = "<span class=\"eyebrow\">Resumo</span><h2>Minha Lista</h2><p class=\"section-intro\">Leve estes itens para a confissão. Leia-os com frases curtas, como no modelo da aba Início.</p>";
    el.appendChild(head);

    var any = false;
    DATA.forEach(function(s, si){
      var groupsWithItems = [];
      s.groups.forEach(function(g, gi){
        var checkedItems = [];
        g.items.forEach(function(text, ii){
          if (state.checked[itemId(si,gi,ii)]) checkedItems.push(text);
        });
        if (checkedItems.length) groupsWithItems.push({ title:g.title, items:checkedItems });
      });
      if (!groupsWithItems.length) return;
      any = true;

      var sGroup = document.createElement("div");
      sGroup.className = "summary-group";
      var sTitle = document.createElement("h3");
      sTitle.textContent = s.num + ". " + s.title;
      sGroup.appendChild(sTitle);

      groupsWithItems.forEach(function(g){
        var subEl = document.createElement("div");
        subEl.className = "summary-sub";
        subEl.textContent = g.title;
        sGroup.appendChild(subEl);
        var ol = document.createElement("ol");
        ol.className = "summary-list";
        g.items.forEach(function(text){
          var li = document.createElement("li");
          li.textContent = text;
          ol.appendChild(li);
        });
        sGroup.appendChild(ol);
      });

      el.appendChild(sGroup);
    });

    if (!any){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = "<strong>Nenhum item marcado ainda.</strong><span>Volte às abas 1 a 4 e marque o que reconhece ter praticado. Os itens marcados vão aparecer aqui, prontos para a confissão.</span>";
      var goBtn = document.createElement("button");
      goBtn.className = "secondary"; goBtn.type = "button";
      goBtn.textContent = "Ir para a seção 1";
      goBtn.addEventListener("click", function(){ setTab("s0"); });
      empty.appendChild(goBtn);
      el.appendChild(empty);
    } else {
      var copyBtn = document.createElement("button");
      copyBtn.className = "secondary"; copyBtn.type = "button";
      copyBtn.textContent = "Copiar lista como texto";
      copyBtn.addEventListener("click", function(){ copyListAsText(); });
      var row = document.createElement("div");
      row.className = "btn-row";
      row.appendChild(copyBtn);
      el.appendChild(row);
    }

    var prayer = document.createElement("div");
    prayer.className = "prayer-card";
    prayer.innerHTML =
      "<h2 style=\"font-size:1rem\">Ato de Contrição</h2>" +
      "<p>Meu Deus, arrependo-me de todo o coração de vos ter ofendido, porque sois infinitamente bom. Com a vossa graça, proponho não mais pecar, evitar as ocasiões de pecado e reparar o mal praticado. Amém.</p>";
    var prayerCopyBtn = document.createElement("button");
    prayerCopyBtn.className = "ghost"; prayerCopyBtn.type = "button";
    prayerCopyBtn.textContent = "Copiar oração";
    prayerCopyBtn.addEventListener("click", function(){
      copyText("Meu Deus, arrependo-me de todo o coração de vos ter ofendido, porque sois infinitamente bom. Com a vossa graça, proponho não mais pecar, evitar as ocasiões de pecado e reparar o mal praticado. Amém.", "Oração copiada.");
    });
    prayer.appendChild(prayerCopyBtn);
    el.appendChild(prayer);

    el.appendChild(buildClearRow());
  }

  function copyListAsText(){
    var lines = ["Minha lista — exame de consciência"];
    DATA.forEach(function(s, si){
      var any = false;
      var block = [];
      s.groups.forEach(function(g, gi){
        var items = [];
        g.items.forEach(function(text, ii){
          if (state.checked[itemId(si,gi,ii)]) items.push("- " + text);
        });
        if (items.length){
          any = true;
          block.push(g.title + ":");
          block = block.concat(items);
        }
      });
      if (any){
        lines.push("");
        lines.push(s.num + ". " + s.title);
        lines = lines.concat(block);
      }
    });
    copyText(lines.join("\n"), "Lista copiada.");
  }

  function copyText(text, message){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast(message);
      }).catch(function(){ fallbackCopy(text, message); });
    } else {
      fallbackCopy(text, message);
    }
  }
  function fallbackCopy(text, message){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast(message);
    } catch(e){
      showToast("Não foi possível copiar.");
    }
  }

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  document.getElementById("dockBtn").addEventListener("click", function(){ setTab("lista"); });

  buildTabs();
  renderIntro();
  renderPrep();
  renderAllSections();
  refreshBadges();
  setTab("intro");
})();
</script>
